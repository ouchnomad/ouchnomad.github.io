<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aion — опыт</title>
<style>
  :root {
    --fg: #0a0a0a;
    --muted: #8a8a8a;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: transparent;
    font-family: var(--font);
    color: var(--fg);
    /* для светлой темы сглаживание убираем — оно «худит» тёмные штрихи */
  }
  .widget { padding: 4px; }

  .experience {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 0 16px;         /* отступ между смысловыми блоками: "5 лет" / "8 месяцев" */
  }
  .entry {
    display: inline-flex;
    align-items: baseline;
    gap: 8px;            /* отступ между цифрой и подписью */
    white-space: nowrap;
  }
  .num {
    font-size: clamp(38px, 8vw, 56px);
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
  }
  .label {
    font-size: clamp(20px, 3.5vw, 26px);
    font-weight: 500;
    color: var(--fg);
  }
  .since {
    font-size: clamp(15px, 2vw, 18px);
    font-weight: 400;
    color: var(--muted);
    white-space: nowrap;
  }

  @media (prefers-color-scheme: dark) {
    :root { --fg: #f5f5f5; --muted: #8a8a8a; }
    html, body {
      -webkit-font-smoothing: antialiased;    /* в тёмной теме возвращаем */
      -moz-osx-font-smoothing: grayscale;
    }
  }
</style>
</head>
<body>
<div class="widget">
  <div class="experience" id="experience">
    <span class="entry"><span class="num" id="years">—</span><span class="label" id="yearsLabel">год</span></span>
    <span class="entry"><span class="num" id="months">—</span><span class="label" id="monthsLabel">месяц</span></span>
    <span class="since" id="since"></span>
  </div>
</div>

<script>
  // ============ НАСТРОЙКИ ============
  const START_DATE = '2021-02';         // год-месяц выхода на первое место работы

  // Опционально: список периодов для суммарного стажа.
  // Если массив пустой [], считается от START_DATE до сегодня.
  // Формат: 'ГГГГ-ММ'. end: null означает "по настоящее время".
  const PERIODS = [
    // { start: '2018-03', end: '2020-06' },
    // { start: '2020-07', end: null },
  ];
  // ===================================

  function diffYM(from, to) {
    let years = to.getFullYear() - from.getFullYear();
    let months = to.getMonth() - from.getMonth();
    if (months < 0) { years--; months += 12; }
    return { years, months };
  }

  function parseYM(str) {
    const [y, m] = str.split('-').map(Number);
    return new Date(y, m - 1, 1);
  }

  function totalExperience(periods) {
    const now = new Date();
    let Y = 0, M = 0;
    for (const p of periods) {
      const start = parseYM(p.start);
      const end = p.end ? parseYM(p.end) : now;
      const d = diffYM(start, end);
      Y += d.years; M += d.months;
    }
    while (M >= 12) { M -= 12; Y++; }
    return { years: Y, months: M };
  }

  function plural(n, one, few, many) {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
    return many;
  }

  function render() {
    const data = PERIODS.length
      ? totalExperience(PERIODS)
      : diffYM(parseYM(START_DATE), new Date());

    document.getElementById('years').textContent = data.years;
    document.getElementById('months').textContent = data.months;
    document.getElementById('yearsLabel').textContent = plural(data.years, 'год', 'года', 'лет');
    document.getElementById('monthsLabel').textContent = plural(data.months, 'месяц', 'месяца', 'месяцев');

    const start = parseYM(START_DATE);
    document.getElementById('since').textContent =
      ', с ' + start.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' });
  }

  render();
  setInterval(render, 60000);
</script>
</body>
</html>
