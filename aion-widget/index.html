<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aion — опыт</title>
<style>
  :root {
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

    /* ====== ФИКСИРОВАННЫЕ ЦВЕТА — не зависят от темы ====== */
    --card-bg: #f2f2f2;      /* фон карточки */
    --card-fg: #000000;      /* основной текст */
    --card-muted: #555555;   /* строка "с февраля 2021" */
    --card-border: rgba(0, 0, 0, 0.05);
    --card-radius: 24px;
    /* ===================================================== */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: transparent;
    font-family: var(--font);
    color: var(--card-fg);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .widget {
    display: inline-block;
    padding: 28px 32px;
    background: var(--card-bg);
    color: var(--card-fg);
    border: 1px solid var(--card-border);
    border-radius: var(--card-radius);
  }

  .main {
    font-size: clamp(24px, 5vw, 32px);
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }

  .since {
    margin-top: 18px;
    font-size: 15px;
    font-weight: 400;
    color: var(--card-muted);
    letter-spacing: 0.01em;
  }
</style>
</head>
<body>
<div class="widget">
  <div class="main" id="main">—</div>
  <div class="since" id="since"></div>
</div>

<script>
  // ============ НАСТРОЙКИ ============
  const START_DATE = '2021-02';

  const PERIODS = [
    // { start: '2018-03', end: '2020-06' },
    // { start: '2020-07', end: null },
  ];
  // ===================================

  const MONTHS_GENITIVE = [
    'января', 'февраля', 'марта', 'апреля', 'мая', 'июня',
    'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'
  ];

  function diffYM(from, to) {
    let years = to.getFullYear() - from.getFullYear();
    let months = to.getMonth() - from.getMonth();
    if (months < 0) { years--; months += 12; }
    return { years, months };
  }

  function parseYM(str) {
    const [y, m] = str.split('-').map(Number);
    return new Date(y, m - 1, 1);
  }

  function totalExperience(periods) {
    const now = new Date();
    let Y = 0, M = 0;
    for (const p of periods) {
      const start = parseYM(p.start);
      const end = p.end ? parseYM(p.end) : now;
      const d = diffYM(start, end);
      Y += d.years; M += d.months;
    }
    while (M >= 12) { M -= 12; Y++; }
    return { years: Y, months: M };
  }

  function plural(n, one, few, many) {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
    return many;
  }

  function formatExperience(data) {
    const { years, months } = data;
    const yPart = years  > 0 ? years  + ' ' + plural(years,  'год', 'года', 'лет')     : '';
    const mPart = months > 0 ? months + ' ' + plural(months, 'месяц', 'месяца', 'месяцев') : '';
    if (yPart && mPart) return yPart + ' и ' + mPart;
    return yPart || mPart || '0 месяцев';
  }

  function render() {
    const data = PERIODS.length
      ? totalExperience(PERIODS)
      : diffYM(parseYM(START_DATE), new Date());

    document.getElementById('main').textContent = formatExperience(data);

    const start = parseYM(START_DATE);
    const monthName = MONTHS_GENITIVE[start.getMonth()];
    document.getElementById('since').textContent = 'с ' + monthName + ' ' + start.getFullYear();
  }

  render();
  setInterval(render, 60000);
</script>
</body>
</html>
